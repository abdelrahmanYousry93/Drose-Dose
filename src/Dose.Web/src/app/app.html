<header class="bar">
  <div class="bar__inner">
    <a class="home-link" routerLink="/"><dose-logo /></a>
    <nav [attr.aria-label]="'nav.main' | t">
      <a routerLink="/open-groups">{{ 'nav.openGroups' | t }}</a>
      <a routerLink="/request-session">{{ 'nav.request' | t }}</a>
      <a routerLink="/my-bookings">{{ 'nav.myBookings' | t }}</a>
    </nav>
    <a class="mine" routerLink="/my-bookings">{{ 'nav.myBookings' | t }}</a>
    <dose-lang-switch />
  </div>
</header>

<dose-pwa-banners />

<main>
  <router-outlet />
</main>

<footer class="foot">
  <div class="foot__inner">
    <p>{{ 'brand.tagline' | t }}</p>
    <div class="follow">
      <span>{{ 'follow.title' | t }}</span>
      <a href="https://www.facebook.com/1432139693316323" target="_blank" rel="noopener" aria-label="Facebook">Facebook</a>
      <a href="https://www.instagram.com/drwsdose/" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
    </div>
    @if (publicSettings.whatsAppLink(); as link) {
      <a class="dose-btn dose-btn--whatsapp" [href]="link" target="_blank" rel="noopener">{{ 'nav.whatsapp' | t }}</a>
    }
  </div>
</footer>
